# Opt in with: docker compose -f compose.yaml -f compose.compress.yaml up --build
# and CODEPARTNER_COMPRESS_ENABLED=true in .env. See docs/context-compression.md.
services:
  codepartner:
    # The sidecar creates a 0770 socket owned by GID 10001. The application
    # may run with a different host UID/GID, so grant only this shared group.
    group_add:
      - "10001"
    environment:
      CODEPARTNER_COMPRESS_BACKEND: sidecar
      CODEPARTNER_COMPRESS_SOCKET: /run/compress-bridge/compress.sock
    volumes:
      - compress-bridge-socket:/run/compress-bridge
    depends_on:
      compress-bridge:
        condition: service_healthy

  compress-bridge:
    build:
      context: .
      dockerfile: infra/compress-bridge/Dockerfile
    init: true
    # The bridge transforms text it is sent. It has no network, no project or
    # home mount, no env_file (so no API keys), and a read-only root filesystem.
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - compress-bridge-socket:/run/compress-bridge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "/opt/compress-bridge/bridge.mjs", "--health",
             "/run/compress-bridge/compress.sock"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  compress-bridge-socket:
