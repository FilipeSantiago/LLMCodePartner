name: llmcodepartner

services:
  semantic-router:
    # Pinned after validation against infra/semantic-router/config.yaml.
    image: ${SEMANTIC_ROUTER_IMAGE:-ghcr.io/vllm-project/semantic-router/extproc@sha256:5c5de6867bf5529c747ff38f5a2593a26cdc7c99e906d682ffc55fcc2705f62a}
    network_mode: host
    # Host networking shares the host's port namespace; 8080 is commonly used
    # by local services, so reserve an application-specific management port.
    command: ["--secure=false", "--api-port=18080"]
    volumes:
      - ./infra/semantic-router/config.yaml:/app/config/config.yaml:ro
      - semantic-router-models:/app/models
    restart: unless-stopped
    healthcheck:
      # The pinned image has no HTTP client. Its download-only mode validates
      # the mounted runtime config without changing service state.
      test: ["CMD", "/app/router-candle", "-config", "/app/config/config.yaml", "-secure=false", "-api-port=18081", "-download-only"]
      interval: 20s
      timeout: 5s
      start_period: 120s
      retries: 10

  agentgateway:
    image: ${AGENTGATEWAY_IMAGE:-cr.agentgateway.dev/agentgateway@sha256:bf2f339ef326d32def2aaeb44b1b4549801293c19b89e764a4228667d97d9896}
    network_mode: host
    command: ["--file", "/config/config.yaml"]
    volumes:
      - ./infra/agentgateway/config.yaml:/config/config.yaml:ro
      - agentgateway-data:/config/data
    restart: unless-stopped
    healthcheck:
      # The pinned distroless image has no shell or HTTP client. Re-validating
      # its loaded configuration is the supported in-container readiness probe.
      test: ["CMD", "/app/agentgateway", "--file", "/config/config.yaml", "--validate-only"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  codepartner:
    build:
      context: .
      args:
        NODE_VERSION: "22"
        OPENSPEC_VERSION: "1.14.0"
        CODEX_VERSION: "0.160.0"
        CLAUDE_CODE_VERSION: "2.1.287"
    init: true
    env_file:
      - .env
    environment:
      HOME: /home/codepartner
      OPENSPEC_BIN: /opt/node-tools/bin/openspec
      DISABLE_AUTOUPDATER: "1"
      MCP_PUBLIC_BASE: ${DOCKER_MCP_PUBLIC_BASE:-http://127.0.0.1:7777}
      OLLAMA_HOST: ${DOCKER_OLLAMA_HOST:-http://127.0.0.1:11434}
      SEMANTIC_ROUTER_URL: ${SEMANTIC_ROUTER_URL:-http://semantic-router:18080}
      AGENTGATEWAY_URL: ${AGENTGATEWAY_URL:-http://agentgateway:4000}
      ROUTING_DB_PATH: ${ROUTING_DB_PATH:-/home/codepartner/.codepartner/routing.sqlite3}
    network_mode: host
    extra_hosts:
      - semantic-router:127.0.0.1
      - agentgateway:127.0.0.1
    volumes:
      - agent-home:/home/codepartner
    restart: unless-stopped
    depends_on:
      semantic-router:
        condition: service_healthy
      agentgateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:7777/v1/models', timeout=3)
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  agent-home:
  semantic-router-models:
  agentgateway-data:
