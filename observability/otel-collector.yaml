# OpenTelemetry Collector (core distribution) for Code Partner -> Langfuse v4.
# Langfuse ingests OTLP over HTTP only (no gRPC). See docs/observability.md.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # First in the pipeline: refuse data instead of growing without bound.
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  # Defense in depth. Code Partner already exports only allowlisted attributes;
  # drop transport-level keys that must never reach Langfuse even if a future
  # client sends them.
  attributes/redact:
    actions:
      - {key: http.request.header.authorization, action: delete}
      - {key: http.request.header.cookie, action: delete}
      - {key: http.response.header.set-cookie, action: delete}
      - {key: url.full, action: delete}
      - {key: url.query, action: delete}
      - {key: db.query.text, action: delete}
      - {key: db.statement, action: delete}
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.completion, action: delete}
      - {key: gen_ai.input.messages, action: delete}
      - {key: gen_ai.output.messages, action: delete}
      - {key: gen_ai.tool.call.arguments, action: delete}
      - {key: gen_ai.tool.call.result, action: delete}
      - {key: langfuse.observation.input, action: delete}
      - {key: langfuse.observation.output, action: delete}
  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 2s

exporters:
  otlp_http/langfuse:
    traces_endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTLP_AUTH}"
      x-langfuse-ingestion-version: "4"
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 2
      # Bounded, in memory. Persistent buffering needs the contrib file_storage
      # extension, which is not justified for a local, best-effort pipeline.
      queue_size: 1000
  # Diagnostic: one summary line per batch in `docker compose logs otel-collector`.
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlp_http/langfuse, debug]
