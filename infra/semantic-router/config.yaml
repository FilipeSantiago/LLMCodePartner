# vLLM Semantic Router policy mirror. `codepartner/<tier>` entrypoints are used
# only by the management route-preview API; Code Partner launches the selected
# provider CLI itself.
version: v0.3
listeners:
  - name: codepartner-preview
    address: 127.0.0.1
    port: 8899
providers:
  defaults:
    model: claude-haiku
  models:
    - name: claude-haiku
      provider_model_id: claude-haiku
      backend_refs: [{name: agentgateway, endpoint: 127.0.0.1:4000, protocol: http}]
    - name: codex-luna-low
      provider_model_id: codex-luna-low
      backend_refs: [{name: agentgateway, endpoint: 127.0.0.1:4000, protocol: http}]
    - name: claude-sonnet
      provider_model_id: claude-sonnet
      backend_refs: [{name: agentgateway, endpoint: 127.0.0.1:4000, protocol: http}]
    - name: codex-luna-medium
      provider_model_id: codex-luna-medium
      backend_refs: [{name: agentgateway, endpoint: 127.0.0.1:4000, protocol: http}]
    - name: codex-sol-medium
      provider_model_id: codex-sol-medium
      backend_refs: [{name: agentgateway, endpoint: 127.0.0.1:4000, protocol: http}]
    - name: claude-opus
      provider_model_id: claude-opus
      backend_refs: [{name: agentgateway, endpoint: 127.0.0.1:4000, protocol: http}]
    - name: codex-sol-high
      provider_model_id: codex-sol-high
      backend_refs: [{name: agentgateway, endpoint: 127.0.0.1:4000, protocol: http}]
routing:
  modelCards:
    - name: claude-haiku
      description: Fast implementation of localized coding changes.
    - name: codex-luna-low
      description: Fast implementation of localized coding changes.
    - name: claude-sonnet
      description: Multi-file feature work and moderate reasoning.
    - name: codex-luna-medium
      description: Multi-file feature work and moderate reasoning.
    - name: codex-sol-medium
      description: Multi-file feature work requiring stronger reasoning.
    - name: claude-opus
      description: Cross-cutting and ambiguous architecture work.
    - name: codex-sol-high
      description: Cross-cutting and ambiguous architecture work.
entrypoints:
  - model_names: [codepartner/simple]
    recipe: codepartner-simple
  - model_names: [codepartner/medium]
    recipe: codepartner-medium
  - model_names: [codepartner/complex]
    recipe: codepartner-complex
recipes:
  - name: codepartner-simple
    routing:
      decisions:
        - name: simple-candidate-selection
          priority: 100
          rules: {operator: AND, conditions: []}
          modelRefs: [{model: claude-haiku}, {model: codex-luna-low}]
          # Code Partner already scopes candidates by OpenSpec complexity. Use a
          # deterministic first candidate until multi-factor signals are
          # explicitly configured and calibrated.
          algorithm: {type: static}
  - name: codepartner-medium
    routing:
      decisions:
        - name: medium-candidate-selection
          priority: 100
          rules: {operator: AND, conditions: []}
          modelRefs: [{model: claude-sonnet}, {model: codex-luna-medium}, {model: codex-sol-medium}]
          algorithm: {type: static}
  - name: codepartner-complex
    routing:
      decisions:
        - name: complex-candidate-selection
          priority: 100
          rules: {operator: AND, conditions: []}
          modelRefs: [{model: claude-opus}, {model: codex-sol-high}]
          algorithm: {type: static}
