runtime:
  semantic_router_url: http://semantic-router:18080
  agentgateway_url: http://agentgateway:4000
  router_timeout_seconds: 10

health:
  failure_threshold: 2

reviewers:
  claude-haiku: codex-luna-low
  codex-luna-low: claude-haiku
  claude-sonnet: codex-sol-medium
  codex-luna-medium: claude-sonnet
  codex-sol-medium: claude-sonnet
  claude-opus: codex-sol-high
  codex-sol-high: claude-opus

routing:
  tiers:
    simple:
      candidates:
        - claude-haiku
        - codex-luna-low

    medium:
      candidates:
        - claude-sonnet
        - codex-luna-medium
        - codex-sol-medium

    complex:
      candidates:
        - claude-opus
        - codex-sol-high

# Per-role capability floors. Coder and reviewer retain floors; planner tiers
# may use any configured model. A model's `capability` is a strength rank.
roles:
  coder:
    min_capability: 1
  reviewer:
    min_capability: 1

# Task execution (coders). Claude prompt-cache TTL, 5m or 1h: a coder's calls are
# usually seconds apart, so 5m cache writes (1.25x input) beat the CLI's 1h (2x);
# a checks run longer than 5 minutes costs one cache rewrite.
execution:
  prompt_cache_ttl: 5m
  # agentic: the coder is a tool-using CLI session that reads and edits files itself.
  # inline: a planned task's current source goes into the prompt; the coder and reviewer
  # get no tools and reply once, CodePartner applies the edits and runs the checks.
  # auto: inline only when every planned edit has exact lines. Unplanned tasks, IDE
  # (non-native) projects and oversized context always run agentic.
  coder_mode: ${CODEPARTNER_CODER_MODE:-agentic}
  # Corrective calls after rejected edits or failing checks, per inline attempt.
  inline_fix_rounds: 2
  # Prompt source budget; a larger task runs agentic.
  inline_context_chars: 120000
  # Optional lint after inline edits; {files} becomes the changed paths.
  inline_lint_command: ""

# Work Package planner (codepartner-plan mode). Routed by WP complexity.
planner:
  tiers:
    low:
#      - claude-haiku
      - codex-sol-medium
    medium:
#      - claude-sonnet
      - codex-sol-medium
    high:
#      - claude-sonnet
      - codex-sol-high
    complex:
#      - claude-opus
      - codex-sol-high
  reasoning_effort:
    complex: xhigh
  max_tool_calls: 60
  # File reads within max_tool_calls; Codebase Memory (kb_) lookups count toward neither.
  max_file_reads: 25
  # One short "what I'm checking and why" line before each tool call
  # (~15-25 output tokens per call). Turn off to compare planner cost.
  narrate: true
  # Claude planner prompt-cache TTL (5m or 1h). A planning turn's calls are seconds
  # apart, so 5m cache writes (1.25x input) suffice; 1h writes cost 2x.
  prompt_cache_ttl: 5m
  # Lines added above and below each planner edit range in the coder and reviewer
  # context and the reviewer's diff snapshot.
  edit_margin_lines: 10
# Native reader/checks subagents (CODEPARTNER_READER_SUBAGENT=true; off by default).
# One cheap model per provider, named by its entry under `models`. The parent locates
# code and hands over paths or commands; a subagent only reads or runs them, so a few
# turns suffice (docs/native-execution.md).
subagents:
  enforce_scope: true
  reader_model:
    claude: claude-haiku
    codex: codex-luna-low
  max_turns: 20
# The planner's KB-first discovery advisories (docs/codebase-memory.md); they never
# replace the hard planner caps above.
discovery:
  mode: advise
  small_file_bytes: 6000
  roles:
    planner:
      mode: advise
      thresholds:
        low: {discovery_calls: 15, full_reads: 2, est_added_tokens: 40000, repeated_or_unexplained_reads: 3}
        medium: {discovery_calls: 25, full_reads: 4, est_added_tokens: 70000, repeated_or_unexplained_reads: 4}
        high: {discovery_calls: 35, full_reads: 6, est_added_tokens: 100000, repeated_or_unexplained_reads: 6}
        complex: {discovery_calls: 45, full_reads: 8, est_added_tokens: 140000, repeated_or_unexplained_reads: 8}
  thresholds:
    low: {tool_calls: 15, full_reads: 2, est_added_tokens: 40000, repeated_or_unexplained_reads: 3}
    medium: {tool_calls: 25, full_reads: 4, est_added_tokens: 70000, repeated_or_unexplained_reads: 4}
    high: {tool_calls: 35, full_reads: 6, est_added_tokens: 100000, repeated_or_unexplained_reads: 6}
    complex: {tool_calls: 45, full_reads: 8, est_added_tokens: 140000, repeated_or_unexplained_reads: 8}

models:
  claude-haiku:
    capability: 1
    provider: claude
    executor: claude-cli
    cli_model: haiku
    gateway_mode: preferred

  codex-luna-low:
    capability: 1
    provider: codex
    executor: codex-cli
    cli_model: gpt-5.6-luna
    reasoning_effort: low
    review_reasoning_effort: medium
    gateway_mode: disabled

  claude-sonnet:
    capability: 3
    provider: claude
    executor: claude-cli
    cli_model: sonnet
    gateway_mode: preferred

  codex-luna-medium:
    capability: 2
    provider: codex
    executor: codex-cli
    cli_model: gpt-5.6-luna
    reasoning_effort: medium
    gateway_mode: disabled

  codex-sol-medium:
    capability: 3
    provider: codex
    executor: codex-cli
    cli_model: gpt-6.1-sol
    reasoning_effort: medium
    gateway_mode: disabled

  claude-opus:
    capability: 5
    provider: claude
    executor: claude-cli
    cli_model: opus
    gateway_mode: preferred

  codex-sol-high:
    capability: 5
    provider: codex
    executor: codex-cli
    cli_model: gpt-6.1-sol
    reasoning_effort: high
    gateway_mode: disabled
