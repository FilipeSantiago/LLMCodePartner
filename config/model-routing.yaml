runtime:
  semantic_router_url: http://semantic-router:18080
  agentgateway_url: http://agentgateway:4000
  router_timeout_seconds: 10

health:
  failure_threshold: 2

routing:
  tiers:
    simple:
      candidates:
        - claude-haiku
        - codex-luna-low

    medium:
      candidates:
        - claude-sonnet
        - codex-luna-medium
        - codex-sol-medium

    complex:
      candidates:
        - claude-opus
        - codex-sol-high

models:
  claude-haiku:
    provider: claude
    executor: claude-cli
    cli_model: haiku
    gateway_mode: preferred

  codex-luna-low:
    provider: codex
    executor: codex-cli
    cli_model: gpt-5.6-luna
    reasoning_effort: low
    gateway_mode: preferred

  claude-sonnet:
    provider: claude
    executor: claude-cli
    cli_model: sonnet
    gateway_mode: preferred

  codex-luna-medium:
    provider: codex
    executor: codex-cli
    cli_model: gpt-5.6-luna
    reasoning_effort: medium
    gateway_mode: preferred

  codex-sol-medium:
    provider: codex
    executor: codex-cli
    cli_model: gpt-6.1-sol
    reasoning_effort: medium
    gateway_mode: preferred

  claude-opus:
    provider: claude
    executor: claude-cli
    cli_model: opus
    gateway_mode: preferred

  codex-sol-high:
    provider: codex
    executor: codex-cli
    cli_model: gpt-6.1-sol
    reasoning_effort: high
    gateway_mode: preferred
