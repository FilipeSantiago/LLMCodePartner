runtime:
  semantic_router_url: http://semantic-router:18080
  agentgateway_url: http://agentgateway:4000
  router_timeout_seconds: 10

health:
  failure_threshold: 2

reviewers:
  claude-haiku: codex-luna-low
  codex-luna-low: claude-haiku
  claude-sonnet: codex-sol-medium
  codex-luna-medium: claude-sonnet
  codex-sol-medium: claude-sonnet
  claude-opus: codex-sol-high
  codex-sol-high: claude-opus

routing:
  tiers:
    simple:
      candidates:
        - claude-haiku
        - codex-luna-low

    medium:
      candidates:
        - claude-sonnet
        - codex-luna-medium
        - codex-sol-medium

    complex:
      candidates:
        - claude-opus
        - codex-sol-high

# Per-role capability floors. Each role (coder, reviewer, planner) routes from
# its own table; a model's `capability` is a role-independent strength rank.
roles:
  coder:
    min_capability: 1
  reviewer:
    min_capability: 1
  planner:
    min_capability: 3

# Work Package planner (codepartner-plan mode). Routed by WP complexity, which
# is role-relative: a `low` planner still outranks every `simple` coder.
planner:
  tiers:
    low:
      - claude-sonnet
      - codex-sol-medium
    medium:
      - claude-opus
      - codex-sol-high
    high:
      - claude-opus
      - codex-sol-high
    complex:
      - claude-opus
      - codex-sol-high
  reasoning_effort:
    complex: xhigh
  max_tool_calls: 60
  # File reads within max_tool_calls; Codebase Memory (kb_) lookups count toward neither.
  max_file_reads: 25
  # One short "what I'm checking and why" line before each tool call
  # (~15-25 output tokens per call). Turn off to compare planner cost.
  narrate: true
# Shared KB-first discovery and advisory telemetry (docs/codebase-memory.md).
# Global disable preserves the original authorized tool behavior; advisories
# never replace the hard planner caps above.
discovery:
  enabled: true
  mode: advise
  search_gate_max: 5
  small_file_bytes: 6000
  outline_gate_lines: 120
  roles:
    planner:
      mode: advise
      thresholds:
        low: {discovery_calls: 15, full_reads: 2, est_added_tokens: 40000, repeated_or_unexplained_reads: 3}
        medium: {discovery_calls: 25, full_reads: 4, est_added_tokens: 70000, repeated_or_unexplained_reads: 4}
        high: {discovery_calls: 35, full_reads: 6, est_added_tokens: 100000, repeated_or_unexplained_reads: 6}
        complex: {discovery_calls: 45, full_reads: 8, est_added_tokens: 140000, repeated_or_unexplained_reads: 8}
    coder:
      mode: advise
      thresholds:
        simple: {discovery_calls: 18, full_reads: 3, est_added_tokens: 30000, repeated_or_unexplained_reads: 4}
        medium: {discovery_calls: 25, full_reads: 4, est_added_tokens: 60000, repeated_or_unexplained_reads: 5}
        complex: {discovery_calls: 35, full_reads: 6, est_added_tokens: 100000, repeated_or_unexplained_reads: 7}
    reviewer:
      mode: advise
      thresholds:
        low: {discovery_calls: 15, full_reads: 2, est_added_tokens: 25000, repeated_or_unexplained_reads: 3}
        medium: {discovery_calls: 20, full_reads: 3, est_added_tokens: 40000, repeated_or_unexplained_reads: 4}
        high: {discovery_calls: 30, full_reads: 5, est_added_tokens: 70000, repeated_or_unexplained_reads: 6}
        complex: {discovery_calls: 40, full_reads: 6, est_added_tokens: 100000, repeated_or_unexplained_reads: 8}
  thresholds:
    low: {tool_calls: 15, full_reads: 2, est_added_tokens: 40000, repeated_or_unexplained_reads: 3}
    medium: {tool_calls: 25, full_reads: 4, est_added_tokens: 70000, repeated_or_unexplained_reads: 4}
    high: {tool_calls: 35, full_reads: 6, est_added_tokens: 100000, repeated_or_unexplained_reads: 6}
    complex: {tool_calls: 45, full_reads: 8, est_added_tokens: 140000, repeated_or_unexplained_reads: 8}

models:
  claude-haiku:
    capability: 1
    provider: claude
    executor: claude-cli
    cli_model: haiku
    gateway_mode: preferred

  codex-luna-low:
    capability: 1
    provider: codex
    executor: codex-cli
    cli_model: gpt-5.6-luna
    reasoning_effort: low
    review_reasoning_effort: medium
    gateway_mode: disabled

  claude-sonnet:
    capability: 3
    provider: claude
    executor: claude-cli
    cli_model: sonnet
    gateway_mode: preferred

  codex-luna-medium:
    capability: 2
    provider: codex
    executor: codex-cli
    cli_model: gpt-5.6-luna
    reasoning_effort: medium
    gateway_mode: disabled

  codex-sol-medium:
    capability: 3
    provider: codex
    executor: codex-cli
    cli_model: gpt-6.1-sol
    reasoning_effort: medium
    gateway_mode: disabled

  claude-opus:
    capability: 5
    provider: claude
    executor: claude-cli
    cli_model: opus
    gateway_mode: preferred

  codex-sol-high:
    capability: 5
    provider: codex
    executor: codex-cli
    cli_model: gpt-6.1-sol
    reasoning_effort: high
    gateway_mode: disabled
